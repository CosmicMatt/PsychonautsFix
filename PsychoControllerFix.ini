[Controller]
; Radial deadzone for left analog stick (0.0 to 0.9, default 0.15)
DeadzoneLeftStick = 0.15

; Radial deadzone for right analog stick (0.0 to 0.9, default 0.15)
DeadzoneRightStick = 0.15

; Invert right stick camera controls (true / false)
InvertRightStickX = false
InvertRightStickY = false

; Sensitivity multiplier for right stick camera (0.5 to 3.0, default 1.0)
CameraSensitivity = 1.0

; Trigger press threshold (0.0 to 1.0, default 0.12)
TriggerThreshold = 0.12

; Enable controller rumble/vibration via XInput (true / false)
EnableVibration = true

; Vibration strength multiplier (0.1 to 2.0, default 1.0)
VibrationStrength = 1.0

[Display]
; Run Psychonauts in Borderless Windowed mode to prevent resolution glitching & desktop flickering on Alt-Tab (true / false)
EnableBorderlessWindow = true

; Target FPS Frame Rate Limiter (0 = Uncapped, 60 = Default 60 FPS, 120, 144, etc.)
; Eliminates 1440p (2560x1440) D3D9 VSync presentation stalls and 20 FPS drops!
TargetFPS = 60

; Show aspect ratio labels in the graphics settings resolution menu, e.g. "1920x1080 (16:9)" or "3440x1440 (21:9 Ultrawide)" (true / false)
ShowAspectRatioInMenu = true

[System]
; Enable XInput to DirectInput proxy translation (true / false)
EnableXInputProxy = true

; Enable in-memory Xbox button prompt patches (true / false)
EnableXboxGlyphs = true
